<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Runner - Jalankan Kode HTML, CSS & JS Langsung di Browser</title>
  <meta name="description" content="HTML Runner: tulis, uji, dan jalankan kode HTML, CSS, dan JavaScript langsung di browser. Gratis, tanpa akun, dengan share link dan download hasil .html." />
  <meta name="keywords" content="html runner, html editor online, jalankan html online, css js playground, code runner, live preview html" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://runner.cost.biz.id/" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f3f8" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1c2e" />

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/icon.jpg" />
  <link rel="apple-touch-icon" href="assets/icon.jpg" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="HTML Runner" />
  <meta property="og:title" content="HTML Runner - Jalankan Kode HTML, CSS & JS Langsung di Browser" />
  <meta property="og:description" content="Tulis, uji, dan jalankan kode HTML, CSS, dan JavaScript langsung di browser. Gratis, tanpa akun, dengan share link dan download .html." />
  <meta property="og:url" content="https://runner.cost.biz.id/" />
  <meta property="og:image" content="https://runner.cost.biz.id/assets/icon.jpg" />
  <meta property="og:image:alt" content="Logo HTML Runner" />
  <meta property="og:locale" content="id_ID" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="HTML Runner - Jalankan Kode HTML, CSS & JS Langsung di Browser" />
  <meta name="twitter:description" content="Tulis, uji, dan jalankan kode HTML, CSS, dan JavaScript langsung di browser. Gratis, tanpa akun." />
  <meta name="twitter:image" content="https://runner.cost.biz.id/assets/icon.jpg" />

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "HTML Runner",
    "url": "https://runner.cost.biz.id/",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript",
    "inLanguage": "id-ID",
    "description": "Tulis, uji, dan jalankan kode HTML, CSS, dan JavaScript langsung di browser. Gratis, tanpa akun, dengan share link dan download hasil .html.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Tentukan lebih awal (sebelum paint): mainkan intro atau lewati.
    (function () {
      var d = document.documentElement;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var seen = false;
      try { seen = sessionStorage.getItem('html-runer-intro') === '1'; } catch (e) {}
      if (reduce || seen) {
        d.classList.add('intro-skip');
      } else {
        d.classList.add('anim');
        try { sessionStorage.setItem('html-runer-intro', '1'); } catch (e) {}
      }
    })();
  </script>
</head>
<body>
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro-inner">
      <svg class="intro-trace" viewBox="0 0 420 60" preserveAspectRatio="none" aria-hidden="true">
        <polyline points="0,30 60,30 70,18 80,42 90,30 150,30 160,8 170,52 180,30 250,30 260,20 270,40 280,30 340,30 350,14 360,46 370,30 420,30" />
      </svg>
      <div class="intro-brand"><span>HTML</span><span>Runner</span></div>
      <p class="intro-tag">pratinjau kode instan</p>
      <div class="intro-bar"><span></span></div>
    </div>
  </div>

  <header class="toolbar">
    <div class="brand">
      <span class="brand-name">HTML Runner</span>
      <span class="brand-tag">pratinjau kode instan</span>
    </div>

    <div class="mode-switch" role="tablist" aria-label="Mode editor">
      <button id="mode-gabung" class="seg" role="tab" aria-selected="false" type="button">Gabung</button>
      <button id="mode-terpisah" class="seg" role="tab" aria-selected="false" type="button">Terpisah</button>
    </div>

    <div class="actions">
      <button id="btn-run" class="btn primary" type="button" title="Buka hasil di tab baru (Ctrl+Enter)">Run ▸<span class="label-ext"> Tab Baru</span></button>
      <label class="btn" for="file-input">Upload .html</label>
      <input type="file" id="file-input" accept=".html,.htm,text/html" hidden />
      <button id="btn-share" class="btn" type="button">Copy Link</button>
      <button id="btn-download" class="btn" type="button">Download</button>
      <button id="btn-reset" class="btn" type="button">Reset</button>
    </div>
    <button id="btn-theme" class="btn" type="button" title="Ganti tema" aria-label="Ganti tema">🌙</button>
  </header>

  <svg class="trace" viewBox="0 0 1200 24" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="0,12 180,12 190,6 200,18 210,12 420,12 430,4 440,20 450,12 640,12 652,8 664,16 676,12 900,12 910,5 920,19 930,12 1200,12" />
  </svg>

  <main class="layout">
    <h1 class="sr-only">HTML Runner - jalankan kode HTML, CSS, dan JavaScript langsung di browser</h1>
    <section class="editors" aria-label="Editor kode">
      <div class="pane" id="pane-single">
        <div class="pane-head"><span>HTML</span></div>
        <textarea id="editor-single" spellcheck="false" placeholder="Tulis satu dokumen HTML lengkap di sini. Blok &lt;style&gt; dan &lt;script&gt; boleh langsung di dalamnya."></textarea>
      </div>

      <div class="pane-stack" id="pane-multi" hidden>
        <div class="pane">
          <div class="pane-head"><span>HTML</span></div>
          <textarea id="editor-html" spellcheck="false" placeholder="&lt;h1&gt;Halo dunia&lt;/h1&gt;"></textarea>
        </div>
        <div class="pane">
          <div class="pane-head"><span>CSS</span></div>
          <textarea id="editor-css" spellcheck="false" placeholder="body { color: navy; }"></textarea>
        </div>
        <div class="pane">
          <div class="pane-head"><span>JS</span></div>
          <textarea id="editor-js" spellcheck="false" placeholder="console.log('halo');"></textarea>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
